name: M0 daily scrape

on:
  schedule:
    # 04:17 UTC = 06:17 SAST. Off the hour to avoid GitHub's top-of-hour cron congestion.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Africa/Johannesburg
      # Identifies us in the User-Agent so employers can see who is calling.
      GHOSTCHECK_CONTACT: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install
        run: pip install -r scraper/requirements.txt

      - name: Scrape (per-employer failures are logged, never fatal)
        # The scraper already catches per-employer errors and exits 0;
        # continue-on-error is a second safety net so collected data still gets committed.
        continue-on-error: true
        run: cd scraper && python -m ghostcheck.run

      - name: Show today's run log
        if: always()
        run: |
          python - <<'PY'
          import json
          log = json.load(open("history/runlog.json"))
          last = log[-1]["run_at"] if log else None
          rows = [e for e in log if e["run_at"] == last]
          print("| employer | ats | status | count | http | note |")
          print("|---|---|---|---|---|---|")
          for e in rows:
              print(f"| {e['employer_id']} | {e['ats_type']} | {e['status']} | {e['count']} | {e['http_status']} | {e['note']} |")
          PY
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          log = json.load(open("history/runlog.json"))
          last = log[-1]["run_at"] if log else None
          print("### M0 run", last)
          print("| employer | ats | status | count | http | note |")
          print("|---|---|---|---|---|---|")
          for e in log:
              if e["run_at"] == last:
                  print(f"| {e['employer_id']} | {e['ats_type']} | {e['status']} | {e['count']} | {e['http_status']} | {e['note']} |")
          PY

      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi
          git commit -m "history: M0 scrape $(date +%F) SAST"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" && exit 1
