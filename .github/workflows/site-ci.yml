name: Site CI

on:
  pull_request:
    paths:
      - 'site/**'
      - 'config/**'
      - 'data/**'
      - 'contract/**'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'config/**'
      - 'data/**'
      - 'contract/**'

defaults:
  run:
    working-directory: site

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Check types
        run: npm run check
        continue-on-error: true
      
      - name: Build site
        run: npm run build
        env:
          FEATURE_OVERVIEW: false
          SITE_PHASE: soft
      
      - name: Check budgets
        run: npm run budget
      
      - name: Validate contract (if changed)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: contract
        run: |
          pip install -r requirements.txt
          # Use data/ if it has generated files, otherwise use data/_samples/
          if [ -f ../data/site.json ]; then
            echo "Validating against data/"
            python validate.py ..
          else
            echo "Skipping validation: no production data files"
            exit 0
          fi
